name: Daily Pipeline

on:
  workflow_dispatch:         # Triggered on schedule by the claude.ai cloud routine (gh workflow run)
  # Fallback scheduler — uncomment if the cloud routine can't dispatch the workflow:
  # schedule:
  #   - cron: '0 7 * * 1-5'  # weekdays 07:00 UTC

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  # No SNOWFLAKE_PASSWORD: the account requires MFA for password auth (account-wide
  # policy), which a headless CI credential can never satisfy. SNOWFLAKE_PRIVATE_KEY_PATH
  # is set below, after the "Write Snowflake key" step below writes the key to disk.
  SNOWFLAKE_DATABASE: JOB_MARKET
  SNOWFLAKE_WAREHOUSE: COMPUTE_WH
  # Least privilege: this pipeline only needs to read/write its own database. SYSADMIN can
  # create and drop *any* object in the account, so a bug or a compromised Actions run had
  # account-wide blast radius — and CLAUDE.md's own Phase 2 says "service user + role +
  # grants (no SYSADMIN)". Set the SNOWFLAKE_ROLE secret to the dedicated role; the fallback
  # names it explicitly so a missing secret fails loudly at connect time rather than
  # silently falling back to whatever the user's default role happens to be.
  # DDL for the role is in README.md ("Snowflake least-privilege role").
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'JOB_MARKET_ETL' }}
  # ANTHROPIC_API_KEY is deliberately NOT set here.
  #
  # Enrichment runs on Claude subscription compute via a claude.ai routine, not on metered
  # API credits — the same model deploy/matcher-routine.md already uses for JobDigest.
  # Handing this job a key is what would let it spend credits, so the enforcement is the
  # absence of the variable, not a flag inside the code.
  #
  # With it unset: skill extraction and personal scoring log a skip and exit 0, and
  # notify.py's curator falls back to ranking by score (see notify.py's curate() call).
  # Nothing fails; the enrichment steps are simply no-ops until the routine feeds them.
  ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
  ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keypair auth needs a FILE, but the secret holds PEM content, not a path. Written to
      # RUNNER_TEMP -- per-job, ephemeral, wiped when the runner is torn down; never a
      # workflow artifact or cache entry, so it can't leak into a later run or a log.
      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$RUNNER_TEMP/snowflake_key.p8"
          chmod 600 "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"

      - name: Step 0 — Migrate schema (idempotent)
        run: python -m ingestion.migrate

      - name: Step 1 — Ingest all sources
        run: python -m ingestion.run

      # personal_scorer (Step 4) joins raw_staging.stg_job_postings for role_category and
      # is_remote. That is a dbt view, and it used to be built only by the full dbt run at
      # the end -- so scoring worked purely because the previous day's view was still
      # lying around. Rebuilding the database exposed it. The view reads nothing but
      # raw.job_postings and two macros, so it is built here, right after ingestion.
      #
      # Deliberately placed *before* the two enrichment steps rather than just before the
      # step that needs it: this is the first step that writes to a dbt-managed schema, so
      # if schemas or grants are wrong it fails within seconds instead of after ~45 minutes
      # of Haiku calls. The full dbt run still comes after scoring, because the intermediate
      # and mart models consume raw.personal_scores.
      - name: Step 2 — dbt run (staging view only, needed by personal scoring)
        working-directory: dbt
        run: dbt run --select stg_job_postings --profiles-dir .

      - name: Step 3 — Skill extraction (Haiku)
        run: python -m enrichment.skill_extractor

      - name: Step 4 — Personal scoring (Haiku)
        run: python -m enrichment.personal_scorer

      - name: Step 5 — dbt seed
        working-directory: dbt
        run: dbt seed --profiles-dir .

      - name: Step 6 — dbt run
        working-directory: dbt
        run: dbt run --profiles-dir .

      - name: Step 7 — dbt test
        working-directory: dbt
        run: dbt test --profiles-dir .

      - name: Step 8 — Telegram notifications
        run: python notify.py

# The test suite, actually wired to something.
#
# Until 2026-07-29 these tests ran nowhere but a developer's laptop: CI had a dependency
# audit and nothing else, and `requirements-dev.txt` recorded the fact ("nothing in CI runs
# pytest or black") without it ever being fixed. That is the same shape as the two other
# failures found that day — a liveness check that could only alert once, and an audit gate
# red for so long it carried no information. A guard nobody runs is documentation, not a
# guard, and service/tests/ is where this repo keeps the assertions it cannot afford to be
# wrong about: that an untrusted picks.json cannot reach the DB, that a GET never
# unsubscribes anyone, that the role taxonomy has not drifted apart across its six files.
#
# Runs the same command CLAUDE.md documents — `python -m pytest` — so a green tick here and
# a green run locally mean the same thing.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two jobs, because the repo is two systems and they cannot share one environment: the root
# stack and service/ pin feedparser, beautifulsoup4 and anthropic to different versions, so
# installing both is a ResolutionImpossible (this workflow's first run, 033fefe). Splitting
# them is not a workaround — each half's tests now run against the versions that half
# actually deploys, and the boundary matches the one CLAUDE.md draws for the code.
jobs:
  jobdigest:
    name: pytest (jobdigest)
    runs-on: ubuntu-latest

    # service/tests/test_geo_sql.py executes the location/work-mode gate as real SQL,
    # because its interesting failures are semantic and invisible in the assembled string:
    # an `or` binding the wrong side, a null that fails a comparison instead of passing it.
    # It skips itself when TEST_DATABASE_URL is unset — which was every machine, so all 23
    # of its cases had never run anywhere. A throwaway Postgres makes them real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobmatch
          POSTGRES_PASSWORD: jobmatch
          POSTGRES_DB: jobmatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Deliberately TEST_DATABASE_URL and never DATABASE_URL: that file inserts rows, and
      # DATABASE_URL is what points at the live box.
      TEST_DATABASE_URL: postgresql://jobmatch:jobmatch@localhost:5432/jobmatch

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            service/requirements.txt
            service/requirements-worker.txt
            service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r service/requirements-dev.txt

      # schema.sql is maintained as the current shape, not a historical base — it already
      # carries work_mode from migration 012 — so loading it alone is enough and the
      # migrations do not need replaying.
      - name: Load schema into the throwaway database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f service/db/schema.sql

      # Everything except the three files that import snowflake at module scope — those
      # belong to the other system and run in the job below, under its own pins.
      - name: pytest
        run: |
          python -m pytest -q service/tests ingestion/tests \
            --ignore=ingestion/tests/test_load.py

      # A skip is silent by default, and this suite's most expensive tests are exactly the
      # ones that skip themselves when misconfigured. If the Postgres service or the schema
      # load ever breaks, test_geo_sql.py goes back to skipping 23 cases and the job stays
      # green — so fail loudly instead of trusting the tick.
      - name: Fail if the SQL gate tests skipped themselves
        run: |
          if python -m pytest service/tests/test_geo_sql.py -q 2>&1 | grep -q "skipped"; then
            echo "::error::test_geo_sql.py skipped — TEST_DATABASE_URL or the schema load is broken."
            exit 1
          fi

  # The market-intelligence half. Decommissioned (CLAUDE.md: JOB_MARKET dropped, routines
  # paused) and kept as a portfolio snapshot — so its tests are kept *green*, not deleted.
  # A snapshot that no longer passes is not evidence of anything. No database: nothing here
  # touches Postgres, and the Snowflake objects no longer exist to touch either.
  market-intel:
    name: pytest (market-intel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: |
          python -m pytest -q enrichment/tests ingestion/tests/test_load.py

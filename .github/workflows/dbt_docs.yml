name: dbt Docs

on:
  # Archived 2026-07-22: the market-intel Snowflake pipeline is decommissioned (JOB_MARKET
  # dropped, cloud routines paused), so a scheduled build would only fail. Kept as portfolio
  # evidence and runnable by hand if a Snowflake instance is ever restored.
  # schedule:
  #   - cron: '30 7 * * 5'  # Friday 07:30 UTC — after pipeline
  workflow_dispatch:

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  # No SNOWFLAKE_PASSWORD: the account requires MFA for password auth (account-wide
  # policy), which a headless CI credential can never satisfy. Keypair is written to disk
  # and SNOWFLAKE_PRIVATE_KEY_PATH set below (see "Write Snowflake private key").
  SNOWFLAKE_DATABASE: JOB_MARKET
  SNOWFLAKE_WAREHOUSE: COMPUTE_WH
  # This ran as SYSADMIN unconditionally, on a real weekly cron -- not caught when
  # pipeline.yml was fixed, because this is a second, separate workflow. `dbt docs
  # generate` only needs to read the already-built catalog; JOB_MARKET_ETL (SELECT on all
  # tables/views) covers it, and it's the same identity pipeline.yml now uses.
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'JOB_MARKET_ETL' }}

permissions:
  contents: write   # peaceiris/actions-gh-pages pushes to the gh-pages branch

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$RUNNER_TEMP/snowflake_key.p8"
          chmod 600 "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"

      - name: Generate dbt docs
        working-directory: dbt
        run: |
          dbt deps --profiles-dir . || true
          dbt docs generate --profiles-dir .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dbt/target

services:
  db:
    image: postgres:16
    container_name: jobmatch_pg
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      # 5433 on host to avoid clashing with a local pg. Overridable because it is not the
      # only thing on this port on a dev machine — set JD_DB_PORT (dev/env.ps1) and the
      # DATABASE_URL built there follows it.
      - "${JD_DB_PORT:-5433}:5432"
    volumes:
      - jobmatch_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  jobmatch_pgdata:
